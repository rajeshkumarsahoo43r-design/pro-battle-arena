<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pro Battle Arena</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10101c;
  color: white;
  text-align: center;
}

header {
  background: #1b1b30;
  padding: 20px;
  border-bottom: 2px solid #ff4655;
}

h1 {
  color: #ff4655;
}

.container {
  max-width: 500px;
  margin: 25px auto;
  padding: 20px;
}

.card {
  background: #202038;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.price {
  color: #00ff99;
  font-size: 22px;
  font-weight: bold;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  box-sizing: border-box;
  border-radius: 6px;
  border: none;
  font-size: 16px;
}

button {
  background: #ff4655;
  color: white;
  font-weight: bold;
}

.qr {
  width: 200px;
  max-width: 100%;
  background: white;
  padding: 10px;
  border-radius: 8px;
}

footer {
  padding: 20px;
  color: #aaa;
}
</style>
</head>

<body>

<header>
  <h1>PRO BATTLE ARENA</h1>
  <p>Free Fire Paid Tournament</p>
</header>

<div class="container">

  <div class="card">
    <h2>🔥 Tournament Details</h2>

    <p>Entry Fee</p>
    <div class="price">₹19</div>

    <p>Per Elimination: ₹15</p>
    <p>Minimum Players: 20</p>
    <p>Maximum Players: 48</p>
  </div>

  <div class="card">
    <h2>💳 UPI Payment</h2>

    <p>Pay ₹19 using the QR Code</p>

    <!-- Replace this with your actual QR image -->
    <img src="qr.png" class="qr" alt="UPI QR Code">

    <p>Payment करने के बाद Registration Form भरें।</p>
  </div>

  <div class="card">
    <h2>📝 Player Registration</h2>

    <form id="registrationForm">

      <input type="text"
        placeholder="Player Name"
        required>

      <input type="text"
        placeholder="Free Fire UID"
        required>

      <input type="tel"
        placeholder="WhatsApp Number"
        required>

      <button type="submit">
        Register Now
      </button>

    </form>

    <p id="message"></p>
  </div>

</div>

<footer>
  © 2026 Pro Battle Arena
</footer>

<script>
document.getElementById("registrationForm")
.addEventListener("submit", function(event) {
  event.preventDefault();

  document.getElementById("message").innerText =
    "Registration form तैयार है। जल्द ही Registration शुरू होगा!";
});
</script>
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBgOesVSRGBUT8P7khVU1q5t-0KrK3Dkds",
    authDomain: "pro-battle-arena-a3922.firebaseapp.com",
    projectId: "pro-battle-arena-a3922",
    storageBucket: "pro-battle-arena-a3922.firebasestorage.app",
    messagingSenderId: "734130748900",
    appId: "1:734130748900:web:fb3d578d6808eaa5b79bf1"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
</script>
</body>
</html>
